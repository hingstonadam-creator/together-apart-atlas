<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">From fabrication to everyday life</title><desc id="desc">Five research stages connected by arrows from August to November 2026. A dashed branch carries resident control, occupied edges and domestic identity from The Civic Skin into Together, Apart.</desc>
<text x="28" y="35" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">TOGETHER, APART. / RESEARCH JOURNEY</text>
<text x="28" y="75" font-family="Montserrat,Arial,sans-serif" font-size="25" font-weight="600" fill="#282823">From fabrication to everyday life</text>
<text x="28" y="100" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">August–November 2026</text>
<rect x="28" y="130" width="510" height="130" fill="#f8f6f0" stroke="#c8c3b8" stroke-width="1.2"/>
<text x="46" y="155" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">01 / AUGUST</text>
<text x="46" y="183" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600" fill="#282823">Establishing the inquiry</text>
<text x="46" y="207" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">Technology, housing and fabrication</text>
<text x="46" y="228.4" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="600" fill="#282823">What can architectural research contribute?</text>
<polyline points="283,260 283,310" fill="none" stroke="#994f39" stroke-width="1.2"/>
<polyline points="279.0,302.0 283,310 287.0,302.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<text x="298" y="289" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="400" fill="#56574e">Focus the investigation</text>
<rect x="28" y="310" width="510" height="130" fill="#f8f6f0" stroke="#c8c3b8" stroke-width="1.2"/>
<text x="46" y="335" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">02 / EARLY SEPTEMBER</text>
<text x="46" y="363" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600" fill="#282823">Housing productivity</text>
<text x="46" y="387" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">Repeatable façade systems and computational design</text>
<text x="46" y="408.4" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="600" fill="#282823">How can repetition accommodate variation?</text>
<polyline points="283,440 283,490" fill="none" stroke="#994f39" stroke-width="1.2"/>
<polyline points="279.0,482.0 283,490 287.0,482.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<text x="298" y="469" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="400" fill="#56574e">Connect systems to occupation</text>
<rect x="28" y="490" width="510" height="130" fill="#f8f6f0" stroke="#c8c3b8" stroke-width="1.2"/>
<text x="46" y="515" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">03 / MID–LATE SEPTEMBER</text>
<text x="46" y="543" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600" fill="#282823">The Civic Skin</text>
<text x="46" y="567" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">Building envelope, public space and occupation</text>
<text x="46" y="588.4" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="600" fill="#282823">What can the façade offer everyday life?</text>
<polyline points="283,620 283,670" fill="none" stroke="#994f39" stroke-width="1.2"/>
<polyline points="279.0,662.0 283,670 287.0,662.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<text x="298" y="649" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="400" fill="#56574e">Move from façade to dwelling</text>
<rect x="28" y="670" width="510" height="130" fill="#f8f6f0" stroke="#c8c3b8" stroke-width="1.2"/>
<text x="46" y="695" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">04 / OCTOBER</text>
<text x="46" y="723" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600" fill="#282823">Reframing the problem</text>
<text x="46" y="747" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">Housing becomes the architectural subject</text>
<text x="46" y="768.4" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="600" fill="#282823">How can apartments support different ways of living?</text>
<polyline points="283,800 283,850" fill="none" stroke="#994f39" stroke-width="1.2"/>
<polyline points="279.0,842.0 283,850 287.0,842.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<text x="298" y="829" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="400" fill="#56574e">Test relationships between households</text>
<rect x="28" y="850" width="510" height="130" fill="#f8f6f0" stroke="#994f39" stroke-width="1.2"/>
<text x="46" y="875" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">05 / LATE OCTOBER–NOVEMBER</text>
<text x="46" y="903" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600" fill="#282823">Together, Apart</text>
<text x="46" y="927" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="400" fill="#282823">Independent homes, shared territories and negotiated thresholds</text>
<text x="46" y="948.4" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="600" fill="#282823">How can generations live close while retaining independence?</text>
<rect x="568" y="510" width="198" height="166" fill="#f8f6f0" stroke="#994f39" stroke-width="1.2"/>
<text x="584" y="538" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="600" fill="#994f39">CONTINUING THREAD</text>
<text x="584" y="570" font-family="Montserrat,Arial,sans-serif" font-size="14" font-weight="600" fill="#282823">Resident control</text>
<text x="584" y="596" font-family="Montserrat,Arial,sans-serif" font-size="14" font-weight="600" fill="#282823">Occupied edges</text>
<text x="584" y="622" font-family="Montserrat,Arial,sans-serif" font-size="14" font-weight="600" fill="#282823">Domestic identity</text>
<polyline points="538,555 568,555" fill="none" stroke="#994f39" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="560.0,559.0 568,555 560.0,551.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<polyline points="667,676 667,915 538,915" fill="none" stroke="#994f39" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="546.0,911.0 538,915 546.0,919.0" fill="none" stroke="#994f39" stroke-width="1.2"/>
<text x="28" y="1030" font-family="Montserrat,Arial,sans-serif" font-size="11" font-weight="400" fill="#56574e">Retrospective synthesis · November 2026. Solid arrows show shifts in emphasis. The dashed branch traces ideas carried from The</text>
<text x="28" y="1045.95" font-family="Montserrat,Arial,sans-serif" font-size="11" font-weight="400" fill="#56574e">Civic Skin into Together, Apart.</text>
<polyline points="28,1090 766,1090" fill="none" stroke="#c8c3b8" stroke-width="1.2"/>
<text x="28" y="1110" font-family="Montserrat,Arial,sans-serif" font-size="9" font-weight="400" fill="#282823">Adam Hingston / ARCH 6004 / Southwark Grounds · Kaurna Country</text>
